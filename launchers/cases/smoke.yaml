# Short training runs that gate the 2D fleet drivers (submit_2d_fleet, submit_cyl_surface_fleet).
# python -m launch submit <case> [--variant <name>]; python -m launch list smoke

smoke_kolm2d:
  purpose: Three-epoch runs of DMF-Gen, Senseiver and latent FM stage 1 on Kolmogorov (gate of submit_2d_fleet kolm).
  sbatch:
    time: 01:30:00
    mem: 64G
    cpus: 8
    gpus: 1
  body: |
    # Smoke gates for the 2D Kolmogorov benchmark: 3 epochs each of
    # (1) DMF-Gen point-cloud FFM, (2) Senseiver Det baseline, (3) latent-FM
    # stage 1, on the trajectory-holdout protocol. PASS = loss finite+descending,
    # [train] lines carry time/peak_mem, no shape errors.
    set -euo pipefail
    export JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0

    echo "=== [1/3] DMF-Gen (pointcloud FFM) ==="
    python -m methods.dmfgen.train \
        --config configs/kolmogorov2d/config_bench_kolm_ffm_smoke.yaml \
        --Demo-Num 999 2>&1 | tail -30

    echo "=== [2/3] Senseiver (Det) ==="
    python -m methods.train_deterministic \
        --config configs/kolmogorov2d/config_baseline_Det_kolm_smoke.yaml 2>&1 | tail -25

    echo "=== [3/3] latent-FM stage 1 ==="
    python -m methods.train_generative \
        --config configs/kolmogorov2d/config_baseline_Gen_kolm_smoke.yaml 2>&1 | tail -25

    echo "=== smoke done ==="
smoke_cyl2d:
  purpose: Short runs of DMF-Gen and Senseiver on the cylinder mesh (gate of submit_2d_fleet cyl).
  sbatch:
    time: 01:00:00
    mem: 64G
    cpus: 8
    gpus: 1
  body: |
    # Smoke gates for the 2D cylinder benchmark: short runs of (1) DMF-Gen
    # point-cloud FFM on the native mesh and (2) Senseiver Det baseline on the
    # mesh (grid-only methods have no cylinder row), on the Re-holdout protocol. PASS = loss finite+descending, [train] lines carry time/peak_mem,
    # no shape errors. The full fleet is submitted --dependency=afterok on this,
    # so -e/pipefail make a trainer crash actually block the fleet (the kolm smoke
    # piped through tail without pipefail and could not gate anything).
    set -euo pipefail
    export JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0

    echo "=== [1/2] DMF-Gen (pointcloud FFM, mesh) ==="
    python -m methods.dmfgen.train \
        --config configs/cylinder2d/config_bench_cyl_ffm_smoke.yaml \
        --Demo-Num 996 2>&1 | tail -30

    echo "=== [2/2] Senseiver (Det, mesh) ==="
    python -m methods.train_deterministic \
        --config configs/cylinder2d/config_baseline_Det_cyl_smoke.yaml 2>&1 | tail -25

    echo "=== smoke done ==="
smoke_cyl_surface:
  purpose: Three-epoch runs of DMF-Gen and Senseiver with the wall-ring sensor pool (gate of submit_cyl_surface_fleet).
  sbatch:
    time: 01:00:00
    mem: 64G
    cpus: 8
    gpus: 1
  body: |
    # Smoke gates for the cylinder SURFACE-TO-FIELD task: 3 epochs each of
    # (1) DMF-Gen on the mesh with sensor_pool=surface (360-cell wall ring, all
    # fields at the taps, compile ON), (2) Senseiver Det on the mesh.
    # PASS = every trainer prints "[dataset] sensor_pool=surface" and finite,
    # descending losses; the surface fleet is --dependency=afterok on this job.
    set -euo pipefail
    export JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0

    echo "=== [1/2] DMF-Gen (pointcloud FFM, mesh, surface pool) ==="
    python -m methods.dmfgen.train \
        --config configs/cylinder2d_surface/config_bench_cyl_surface_ffm_smoke.yaml \
        --Demo-Num 993 2>&1 | grep -vE 'it/s\]|KeOps\] (Compiling|Generating)' | tail -30

    echo "=== [2/2] Senseiver (Det, mesh, surface pool) ==="
    python -m methods.train_deterministic \
        --config configs/cylinder2d_surface/config_baseline_Det_cyl_surface_smoke.yaml 2>&1 | grep -vE 'it/s\]' | tail -25

    echo "=== surface smoke done ==="
