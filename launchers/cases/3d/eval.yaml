      --seed 0 --op-seed 1000 --n-snapshots 50 --K 2 --cond-fields 0 2 --n-obs 19531 19531 \
      --shard $((SLURM_ARRAY_TASK_ID % 2)) --num-shards 2 --out-dir $FRB_ROOT/outputs/rescore_jhu/sit_N41_${CK}_rechunk_tune_K2
