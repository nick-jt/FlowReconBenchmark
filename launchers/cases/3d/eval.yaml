s3gm_finalize:
  purpose: S3GM retuned-guidance arm (SM row) - stability check of (alpha, beta) on the final checkpoint, the arm
    on all 50 snapshots at last.pt and best.pt, and the upstream guidance on 5 snapshots (diverges).
  sbatch:
    time: '16:00:00'
    mem: 96G
    cpus: 8
    gpus: 1
  body: |
    set -u
    # Post-training: (1) re-confirm the stabilised (alpha,beta) on the FINAL
    # checkpoint, (2) evaluate the JHU-tuned arm, (3) evaluate the upstream arm to
    # document its divergence. Both arms are reported; neither substitutes.
    export JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0 JHU_AUGMENT=octahedral
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    export MPLBACKEND=Agg
    RUN=$(ls -dt outputs/runs/JHU/baseline_s3gm/matched/Baseline_s3gm_Stage1_DemoN94_* | head -1)
    L="$FRB_LOGS/s3gm_finalize_${SLURM_JOB_ID}.log"
    echo "RUN=$RUN" >> "$L"

    echo "===== STEP 1: stability re-confirmation on FINAL checkpoint =====" >> "$L"
    ISO_ARMS=v3 python -u -m methods.s3gm.tuning.isolate --run-dir "$RUN" --ckpt last --n-steps 200 \
        --device auto --out "$RUN/isolation_final.json" >> "$L" 2>&1
    echo "step1 rc=$?" >> "$L"

    for CK in last best; do
      echo "===== STEP 2: eval arm=jhu_tuned ckpt=$CK =====" >> "$L"
      python -u -m methods.s3gm.eval_jhu --run-dir "$RUN" --ckpt $CK --arm jhu_tuned \
          --seed 0 --op-seed 1000 --n-snapshots 50 --K 8 \
          --cond-fields 0 2 --n-obs 19531 19531 >> "$L" 2>&1
      echo "eval jhu_tuned $CK rc=$?" >> "$L"
    done

    echo "===== STEP 3: eval arm=upstream (documents divergence, 5 snaps) =====" >> "$L"
    python -u -m methods.s3gm.eval_jhu --run-dir "$RUN" --ckpt last --arm upstream \
        --seed 0 --op-seed 1000 --n-snapshots 5 --K 2 \
        --cond-fields 0 2 --n-obs 19531 19531 >> "$L" 2>&1
    echo "eval upstream rc=$?" >> "$L"
s3gm_jhu_sweep:
  purpose: S3GM guidance legs on TUNE snapshots of one prior (env S3GM_RUN, LEGS); with the sigma_max-rule prior
    it gives the divergence numbers of the SM.
  sbatch:
    time: 04:00:00
    mem: 96G
    cpus: 8
    gpus: 1
  body: |
    set -u
    export JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0 JHU_AUGMENT=octahedral
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    export MPLBACKEND=Agg
    RUN=${S3GM_RUN:-$(ls -dt outputs/runs/JHU/baseline_s3gm/matched/Baseline_s3gm_Stage1_DemoN94_* | head -1)}
    SPLIT=${SPLIT:-tune}; SNAPS=${SNAPS:-25}; K=${K:-8}; CK=${CK:-last}
    LEGS=${LEGS:?set LEGS, e.g. "custom,0,0,1000,1;jhu_tuned,,,1000,1;upstream,,,1000,2;jhu_tuned,,,200,1" (the SM sigma_max-rule legs, SNAPS=2 K=2)}
    L="$FRB_LOGS/s3gm_jhu_sweep_legs_${SLURM_JOB_ID}.log"
    echo "RUN=$RUN SPLIT=$SPLIT SNAPS=$SNAPS K=$K CK=$CK LEGS=$LEGS" >> "$L"
    echo "$LEGS" | tr ';' '\n' | while IFS=, read ARM AC BE NS OL; do
      EXTRA=""; [ "$ARM" = custom ] && EXTRA="--alpha-case $AC --beta $BE"
      echo "===== arm=$ARM alpha_case=$AC beta=$BE n_steps=$NS overlap=$OL =====" >> "$L"
      python -u -m methods.s3gm.eval_jhu --run-dir "$RUN" --ckpt "$CK" --arm "$ARM" $EXTRA \
          --split "$SPLIT" --n-steps "$NS" --overlap "$OL" \
          --seed 0 --op-seed 1000 --n-snapshots "$SNAPS" --K "$K" \
          --cond-fields 0 2 --n-obs 19531 19531 >> "$L" 2>&1 || echo "leg $ARM N=$NS ol=$OL FAILED" >> "$L"
    done
    grep -c FAILED "$L" >/dev/null && exit 1 || exit 0
