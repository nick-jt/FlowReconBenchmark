# Evaluation of the JHTDB rows on the 50-snapshot canonical draw of cube 3 (sensor seed seed*777 + held-out index, 19,531 sensors on U_x and U_z, K = 8). analysis.paired_ci_jhu splits the snapshots into TUNE (odd) and TEST (even), selects each row's setting on TUNE and reports TEST; outputs land in outputs/rescore_jhu/ under the names it reads.
# python -m launch submit <case> [--variant <name>]; python -m launch list 3d/eval

rescore_jhu:
  purpose: FNO3D-FM (best/last x NFE 4/16), latent FM (best/last), Senseiver (budget.pt), Set-DeepONet (best/budget)
    and Set-DeepONet++ (best) on all 50 snapshots.
  sbatch:
    time: 04:00:00
    mem: 240G
    cpus: 16
    gpus: 1
  body: |
    set -u
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0
    O=$FRB_ROOT/outputs/rescore_jhu; J=$FRB_ROOT/outputs/runs/JHU
    run_of() { readlink -f "$(ls -d $J/$1 | tail -1)"; }
    FNO=$(run_of "baseline_fno/fno3d_xcube_DemoN90_*")
    LFM=$(run_of "baseline_latent_fm/Baseline_latent_fm_Stage2_DemoN24_*")
    SEN=$(run_of "baseline_senseiver/Baseline_senseiver_Stage1_DemoN43_*")
    DON=$(run_of "baseline_deeponet/deeponet_iclr_jhu_xcube_DemoN60_*")
    DPP=$(run_of "baseline_deeponetpp/deeponetpp_iclr_jhu_xcube_DemoN60_*_p640")
    mkdir -p $O
    RC=0
    for CK in best last; do for NFE in 4 16; do
      echo "##### fno3d-fm $CK nfe$NFE"; python -u -m methods.dmfgen.ensemble_eval --run-dir "$FNO" --ckpt $CK.pt --split val \
        --K 8 --n-steps $NFE --n-snapshots 50 --n-obs 19531 19531 --cond-fields 0 2 --seed 0 --op-seed 1000 \
        --chunk 1953125 --no-figs --out $O/fno3d_N90_${CK}_nfe${NFE}_K8_val50.json || RC=1
    done; done
    for CK in best last; do
      echo "##### latent fm $CK"; python -u -m methods.latent_fm.eval_jhu --run-dir "$LFM" --ckpt $CK --split val \
        --K 8 --nfe 4 --n-snapshots 50 --seed 0 --op-seed 1000 --cond-fields 0 2 --n-obs 19531 19531 --no-figs \
        --out $O/latentfm_N24_${CK}_K8_nfe4_val50.json || RC=1
    done
    echo "##### senseiver"; python -u -m methods.senseiver.eval_jhu --run-dir "$SEN" --ckpt budget.pt --split val \
      --seed 0 --n-snapshots 50 --n-obs 19531 --out $O/senseiver_N43_budget_val50.json || RC=1
    for CK in best budget; do
      echo "##### set-deeponet $CK"; python -u -m methods.deeponet.eval_jhu --run-dir "$DON" --ckpt $CK.pt --split val \
        --seed 0 --n-obs 19531 --n-snapshots 50 --cond-fields 0 2 --out $O/deeponet_N60_${CK}_val50.json || RC=1
    done
    echo "##### set-deeponet++ p640"; python -u -m methods.deeponet.eval_jhu_pp --run-dir "$DPP" --ckpt best.pt --split val \
      --seed 0 --n-obs 19531 --n-snapshots 50 --cond-fields 0 2 --out $O/deeponetpp_p640_best_val50.json || RC=1
    echo "exit $RC"; exit $RC
eval_dmfgen_jhu_tune:
  purpose: DMF-Gen (N15) TUNE grid - best/last x NFE 2/4/8 (best NFE 4 on all 50 snapshots, the others on the odd
    ones).
  sbatch:
    time: 06:00:00
    mem: 240G
    cpus: 16
    gpus: 1
  body: |
    set -u
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0
    O=$FRB_ROOT/outputs/rescore_jhu
    RD=$(readlink -f "$(ls -d $FRB_ROOT/outputs/runs/JHU/pointcloud_ffm/iclr_jhu_xcube_aug_DemoN15_* | tail -1)")
    EV="--split val --K 8 --n-snapshots 50 --n-obs 19531 19531 --cond-fields 0 2 --seed 0 --op-seed 1000 --no-figs"
    mkdir -p $O "$RD/Evaluation"
    RC=0
    python -u -m methods.dmfgen.ensemble_eval --run-dir "$RD" --ckpt best.pt --n-steps 4 $EV \
      --out "$RD/Evaluation/crps_nfe4_K8_all50.json" || RC=1
    for SET in "best 2" "best 8" "last 2" "last 4" "last 8"; do set -- $SET
      echo "##### dmfgen $1 nfe$2"; python -u -m methods.dmfgen.ensemble_eval --run-dir "$RD" --ckpt $1.pt --parity odd \
        --n-steps $2 $EV --out $O/dmfgen_N15_$1_nfe$2_K8_val50odd.json || RC=1
    done
    echo "exit $RC"; exit $RC
band_jhu_test:
  purpose: TEST-half band passes (band energy and correlation, mean-removed Hann window) at the TUNE-chosen settings
    - DMF-Gen last NFE 2, latent FM last, FNO3D-FM best NFE 4, Senseiver budget.pt, FNO3D best.pt.
  sbatch:
    time: 04:00:00
    mem: 240G
    cpus: 16
    gpus: 1
  body: |
    set -u
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0
    O=$FRB_ROOT/outputs/rescore_jhu; J=$FRB_ROOT/outputs/runs/JHU
    run_of() { readlink -f "$(ls -d $J/$1 | tail -1)"; }
    RD=$(run_of "pointcloud_ffm/iclr_jhu_xcube_aug_DemoN15_*")
    FNO=$(run_of "baseline_fno/fno3d_xcube_DemoN90_*")
    DET=$(run_of "baseline_fno/fno3d_det_xcube_DemoN97_*")
    LFM=$(run_of "baseline_latent_fm/Baseline_latent_fm_Stage2_DemoN24_*")
    SEN=$(run_of "baseline_senseiver/Baseline_senseiver_Stage1_DemoN43_*")
    EV="--split val --K 8 --n-snapshots 50 --n-obs 19531 19531 --cond-fields 0 2 --seed 0 --op-seed 1000 --no-figs"
    RC=0
    python -u -m methods.dmfgen.ensemble_eval --run-dir "$RD" --ckpt last.pt --parity even --band-metrics --n-steps 2 $EV \
      --out $O/dmfgen_N15_last_nfe2_K8_val50even_band_demean.json || RC=1
    python -u -m methods.latent_fm.eval_jhu --run-dir "$LFM" --ckpt last --split val --K 8 --nfe 4 --n-snapshots 50 \
      --seed 0 --op-seed 1000 --cond-fields 0 2 --n-obs 19531 19531 --no-figs --band-metrics \
      --out $O/latentfm_N24_last_K8_nfe4_val50_band_demean.json || RC=1
    python -u -m methods.dmfgen.ensemble_eval --run-dir "$FNO" --ckpt best.pt --parity even --band-metrics --n-steps 4 $EV \
      --chunk 1953125 --out $O/fno3d_N90_best_nfe4_K8_val50even_band_demean.json || RC=1
    python -u -m methods.senseiver.eval_jhu --run-dir "$SEN" --ckpt budget.pt --split val --seed 0 --n-snapshots 50 \
      --n-obs 19531 --band-metrics --out $O/senseiver_N43_budget_val50_band_demean.json || RC=1
    python -u -m methods.dmfgen.ensemble_eval --run-dir "$DET" --ckpt best.pt --split val --K 2 --n-snapshots 50 \
      --n-obs 19531 19531 --cond-fields 0 2 --seed 0 --op-seed 1000 --no-figs --band-metrics --chunk 1953125 \
      --out $O/fno3d_det_N97_best_val50_band_demean.json || RC=1
    echo "exit $RC"; exit $RC
eval_fno3d_det_jhu:
  purpose: Deterministic FNO3D (N97) best.pt and last.pt on all 50 snapshots (K = 2 identical members so the fair
    CRPS is defined), then the inference time per field.
  sbatch:
    time: 02:00:00
    mem: 240G
    cpus: 16
    gpus: 1
  body: |
    set -u
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0
    DET=$(readlink -f "$(ls -d $FRB_ROOT/outputs/runs/JHU/baseline_fno/fno3d_det_xcube_DemoN97_* | tail -1)")
    RC=0
    for CK in best last; do
      python -u -m methods.dmfgen.ensemble_eval --run-dir "$DET" --ckpt $CK.pt --split val --K 2 --n-snapshots 50 \
        --n-obs 19531 19531 --cond-fields 0 2 --seed 0 --op-seed 1000 --no-figs --band-metrics --chunk 1953125 \
        --out $FRB_ROOT/outputs/rescore_jhu/fno3d_det_N97_${CK}_val50.json || RC=1
    done
    python - "$DET" <<'PY' || RC=1
    import sys, time, torch
    from methods.dmfgen.ensemble_eval import load_run
    from methods.dmfgen.helpers import build_sparse_condition
    model, ds, _ = load_run(sys.argv[1], "best.pt", "cuda:0")
    item = ds[0]
    c, f = item["coords"][None].cuda(), item["fields"][None].cuda()
    torch.manual_seed(0)
    oc, ov, om, oi, ofid = build_sparse_condition(coords_full=c, fields_full=f, cond_fields=[0, 2],
                                                  n_obs_min=[19531], n_obs_max=[19531])
    torch.cuda.reset_peak_memory_stats()
    with torch.no_grad():
        for i in range(8):
            if i == 3:
                torch.cuda.synchronize(); t0 = time.perf_counter()
            model.predict(c, oc, ov, om, ofid)
        torch.cuda.synchronize()
    print(f"[cost] s/field {(time.perf_counter() - t0) / 5:.4f} peak_GB {torch.cuda.max_memory_allocated() / 1e9:.2f}")
    PY
    echo "exit $RC"; exit $RC
eval_sit_jhu_tune:
  purpose: SiT-point per-step (re-chunked) sampler, best.pt vs last.pt on the 25 TUNE snapshots, K = 2, two shards
    per checkpoint.
  sbatch:
    time: 03:00:00
    mem: 128G
    cpus: 8
    gpus: 1
    array: 0-3
