# =============================================================================
# PoF-benchmark 2D Kolmogorov — DMF-Gen (point-cloud rectified flow, taken
# as-is from the DMF-Gen paper; GL_rbf_ENH backbone = the frozen N29 3D
# configuration re-instantiated at 2D). Protocol identical to the baseline
# configs in this directory: JHU_SPLIT_MODE=block JHU_SPLIT_GAP=0 (set by the
# launcher), train_ratio 0.8 = 32/8 trajectory holdout, sensors 0.1-10%.
# No augmentation v1: Kolmogorov forcing (sin ky) breaks rotational symmetry,
# and 2560 train frames >> JHU's 150 — revisit x-translation aug only if the
# val curve says data-limited.
# spectral_weight 0 until spectral_loss.py's block cut is verified in 2D.
# Budget: bs 20 -> 128 steps/epoch -> 400 epochs = 51k steps (~fleet-matched).
# =============================================================================

Demo_Num: 999
device_ids: [0]

data: "data/kolmogorov2d/Kolmogorov2D_shu_stride4.h5"
save_dir: "outputs/runs/_legacy/smoke_kolm_ffm"

seed : 42
epochs : 3
batch_size : 20
lr : 1.0e-4
weight_decay : 1.0e-6
train_ratio : 0.8
time_stride : 1
num_workers : 4
field_names: ["vorticity"]

backbone: "GL_rbf_ENH"

hidden_dim : 256
cond_dim : 128
field_embed_dim : 128
sigma_min : 1.0e-4
rbf_sigma : 0.05

USE_FOURIER_PE: true
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0

latent_dim: 256
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
decode_chunk_size: 4096
share_query_proj: false

summary_type: "mean"

gather_mode: "topk_rbf_glres"
gather_topk: 16
sensor_local_topk: 16
gather_query_chunk_size: 2048
learnable_rbf_sigma: true
neighbor_backend: "keops"
sensor_local_dropout: 0.0

sensor_coord_encoding: "fourier"
latent_sensor_reinject: true
latent_reinject_every: 1
query_latent_readout: true
query_readout_type: "coord"
query_readout_scale_init: 1.0e-2
enhanced_head_norm: true
glres_scale_init: 1.0e-2

Num_x: 256
Num_y: 256
fno_modes_x: 32
fno_modes_y: 32
fno_hidden_channels: 64
fno_n_layers: 4
condition_blur: true
condition_blur_kernel: 15
condition_blur_sigma: 2.5

n_query_points : 1310        # 2% of 256^2, mirroring the JHU 2%-query budget
query_sampling: "uniform"
query_sample_near_ratio: 0.25
query_sample_far_ratio: 0.25
query_sample_sigma_ratio: 0.05
prior : "rff"
rff_features : 256
rff_lengthscale : 0.05       # Kolmogorov carries energy well past the 0.15 JHU scale

eval_every : 5
save_every : 1000000         # in-training visualization assumes the JHU grid; evals are offline
n_steps_generation : 32

cond_fields :   [0]          # vorticity (single-channel dataset)
n_obs_min_list: [65]         # 0.1% of 65536
n_obs_max_list: [6554]        # 10%

vis_cond_fields:
vis_n_obs_list: [655]        # selection draw at the evaluation count (protocol)

ode_solver : "euler"
benchmark_n_steps : [2, 4, 16]

use_amp: true
ema_decay: 0.9995

t_sampling: "logit_normal"
compile_model: false

spectral_weight: 0.0
spectral_block: 32
spectral_bins: 12
